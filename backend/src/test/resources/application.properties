# ==============================================================================
# Vinay Agri Inputs - Test Application Configuration (In-Memory H2)
# Enables reliable unit & integration tests without requiring live external MySQL
# ==============================================================================
spring.application.name=vinay-agri-backend-test

spring.datasource.url=jdbc:h2:mem:vinay_agri_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=test_jwt_secret_key_tonk_rajasthan_test_environment_2026
app.jwt.expiration-ms=3600000
app.google.client-id=test-google-client-id.apps.googleusercontent.com
