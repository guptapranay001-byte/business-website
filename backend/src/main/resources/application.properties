# ==============================================================================
# Vinay Agri Inputs - Centralized Spring Boot Backend Configuration
# ==============================================================================

# Application & Server Information
spring.application.name=vinay-agri-backend
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# MySQL Database Configuration (Environment-Based)
# Override via DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vinay_agri_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Security & JWT Configuration Placeholders
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:vinay_agri_inputs_super_secure_secret_key_tonk_rajasthan_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Cross-Origin Resource Sharing (CORS)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging configuration
logging.level.com.vinayagri=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
